:-2.09s;font-size:20px" x="413" y="124" fill="#ff3b3b">▒</text><text class="fl" style="animation-delay:-2.20s;font-size:14px" x="413" y="142" fill="#ff9a3d">░</text><text class="fl" style="animation-delay:-2.31s;font-size:20px" x="413" y="132" fill="#ff6a1a">▒</text><text class="fl" style="animation-delay:-2.42s;font-size:16px" x="413" y="128" fill="#ffc23d">▒</text><text class="fl" style="animation-delay:-2.53s;font-size:14px" x="413" y="133" fill="#ffc23d">~</text><text class="fl" style="animation-delay:-2.64s;font-size:16px" x="413" y="135" fill="#ff9a3d">▒</text><text class="fl" style="animation-delay:-2.75s;font-size:20px" x="413" y="146" fill="#ff3b3b">▒</text></g>
<g class="dr"><text x="18" y="40">            __        __</text><text x="18" y="60">           /  \______/  \___</text><text x="18" y="80">          /  /\        /\   \__</text><text x="18" y="100">         |  /  \  __  /  \     `-.___</text><text x="18" y="120">         | |  (●)/  \(●)  |         _ `--._</text><text x="18" y="140">          \ \    \__/    / \___..--&#x27; `\    `&gt;</text><text x="18" y="160">           \ `.  ____  .&#x27;          ___/ /\/</text><text x="18" y="180">            `-.\/VVVV\/.-&#x27;   __.--&#x27;   _/</text><text x="18" y="200">               \\____//  _.-&#x27;     __.-&#x27;</text><text x="18" y="220">                `----&#x27;--&#x27;    __.-&#x27;</text><text x="18" y="240">                        \___/</text></g>
