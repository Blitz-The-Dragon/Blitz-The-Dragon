  <text class="name g1" x="832" y="222">BLITZ</text>
  <text class="name g2" x="832" y="222">BLITZ</text>
  <text class="name" x="832" y="222" fill="#f2f2f2">BLITZ</text>
  <text class="sub" x="830" y="252">// THE AI JAILBREAKER DRAGON</text>
</g>
</svg>